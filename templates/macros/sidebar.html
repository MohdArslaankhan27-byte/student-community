
{% macro sidebar(user) %}

<!-- Sidebar Overlay -->
<div
    id="sidebarOverlay"
    onclick="toggleSidebar()"
    class="fixed inset-0 z-50 hidden bg-black/50">
</div>


<!-- Sidebar -->
<aside
    id="sidebar"
    class="fixed top-0 left-0 z-[60] h-full w-80 bg-slate-950
           border-r border-slate-800 transform -translate-x-full
           transition-transform duration-300 overflow-y-auto">

    <!-- Header -->
    <div class="flex items-center justify-between h-14 px-5 border-b border-slate-800">

        <h2 class="text-lg font-semibold text-white">
            My Profile
        </h2>

        <button
            type="button"
            onclick="toggleSidebar()"
            class="text-slate-400 hover:text-white text-2xl">
            ×
        </button>

    </div>


    <!-- Profile -->
    <div class="flex flex-col items-center px-5 py-6 border-b border-slate-800">

        <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-slate-700">

            {% if user.photo %}

                <img
                    src="{{ url_for('static', filename='uploads/' + user.photo) }}"
                    alt="Profile Photo"
                    class="w-full h-full object-cover">

            {% else %}

                <div class="w-full h-full flex items-center justify-center text-3xl bg-slate-800">
                    👤
                </div>

            {% endif %}

        </div>

        <h2 class="mt-3 text-lg font-semibold text-white">
            {{ user.name }}
        </h2>

    </div>


    <!-- Profile Links -->
    <div class="p-4 space-y-2">

        <a href="{{ url_for('basic_info') }}"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            👤 Basic Information
        </a>

        <a href="{{ url_for('acad_info') }}"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            🎓 Academic Information
        </a>

        <a href="#"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            💻 Skills
        </a>

        <a href="#"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            🚀 Projects
        </a>

        <a href="#"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            🏆 Achievements
        </a>

        <a href="#"
           class="block px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white">
            🔗 Social Links
        </a>

    </div>


    <!-- Actions -->
    <div class="px-4 py-4 border-t border-slate-800">

        <button
            type="button"
            onclick="openEditBox()"
            class="w-full px-4 py-3 mb-2 rounded-lg bg-slate-800 text-white hover:bg-slate-700">
            ✏️ Edit Profile
        </button>

        <a
            href="{{ url_for('logout') }}"
            class="block w-full px-4 py-3 text-center rounded-lg text-red-400 hover:bg-red-950/30">
            🚪 Logout
        </a>

    </div>

</aside>



<!-- Edit Modal -->
<div id="editModal" class="edit-modal">

    <div class="edit-box">

        <div class="edit-box-header">
            <h2>Edit Profile</h2>

            <button type="button" class="close-btn" onclick="closeEditBox()">
                ×
            </button>
        </div>


        <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">

            <!-- Select Information -->
            <div class="edit-field">

                <label for="editField">
                    Information
                </label>

                <select name="field" id="editField" required>

                    <option value="" selected disabled>
                        Select information
                    </option>

                    <option value="name">Name</option>
                    <option value="phone">Phone</option>
                    <option value="email">Email</option>
                    <option value="dob">Date of Birth</option>
                    <option value="gender">Gender</option>
                    <option value="address">Address</option>
                    <option value="photo">Profile Photo</option>
                    <option value="college">College / School</option>
                    <option value="course">Course</option>
                    <option value="branch">Branch / Department</option>
                    <option value="semester">Semester</option>
                    <option value="roll_number">Roll Number</option>
                    <option value="enrollment_number">Enrollment Number</option>
                    <option value="academic_year">Academic Year</option>
                    <option value="cgpa">CGPA</option>
                    <option value="percentage">Percentage</option>
                    <option value="attendance">Attendance</option>
                    <option value="subjects">Subjects</option>
                    <option value="marks">Marks</option>
                    <option value="grades">Grades</option>
                    <option value="backlogs">Backlogs</option>

                </select>

            </div>


            <!-- Value -->
            
<div class="edit-field">

    <label for="editValue">
        Value
    </label>

    <div id="valueField">

        <input
            type="text"
            name="value"
            id="editValue"
            placeholder="Enter new value"
        >

    </div>

</div>




            <!-- Buttons -->
            <div class="edit-modal-actions">

                <button type="submit" class="update-btn">
                    Update
                </button>

                <button
                    type="button"
                    class="modal-close-btn"
                    onclick="closeEditBox()"
                >
                    Close
                </button>

            </div>

        </form>

    </div>

</div>

{% endmacro %}

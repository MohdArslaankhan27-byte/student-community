<!-- Upload Marks & Results -->
    
<div id="upload-marks" class="card">
    <h2>Upload Student Marks</h2>

    <form id="uploadMarksForm" method="POST" action="{{ url_for('adminpage') }}">

        <div class="form-group">
            <label for="roll_number">Student Roll Number</label>
            <input type="text"
                    id="roll_number"
                    name="roll_number"
                    placeholder="Enter student roll number"
                    required>
        </div>

        <div class="form-group">
            <label for="subject_id">Subject</label>

            <select id="subject_id" name="subject_id" required>
                <option value="">Select Subject</option>

                {% for subject in subjects %}
                    <option value="{{ subject.id }}">
                        Semester {{ subject.semester }} -
                        {{ subject.subject_code }} -
                        {{ subject.subject_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="marks-grid">

            <div class="form-group">
                <label for="sessional_1">Sessional 1</label>
                <input type="number"
                       id="sessional_1"
                       name="sessional_1"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <div class="form-group">
                <label for="sessional_2">Sessional 2</label>
                <input type="number"
                       id="sessional_2"
                       name="sessional_2"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <div class="form-group">
                <label for="semester_exam">Semester Exam</label>
                <input type="number"
                       id="semester_exam"
                       name="semester_exam"
                       min="0"
                       step="0.01"
                       required>
            </div>

        </div>

        <button type="submit">Save Marks</button>

    </form>
</div>



<!-- Edit / Delete Marks -->
<div id="edit-marks" class="card">

    <h2>Edit / Delete Student Marks</h2>

    <div class="form-group">
        <label for="search_roll_number">Student Roll Number</label>
        <input type="text" id="search_roll_number"
               placeholder="Enter student roll number">
        <button type="button" onclick="fetchStudentMarks()">
            Search
        </button>
    </div>

    <h3 id="studentName"></h3>
    <div id="marksResult"></div>

</div>




<!-- Create Coordinator Snippet -->
<div id="create-coordinator" class="snippet" style="display: none;">

    <h2>Create Coordinator</h2>
    <p>Search for a student and assign them the coordinator role.</p>

    <form id="coordinatorForm">

        <label for="coordinator-email">Student Email:</label>
        <input
            type="email"
            id="coordinator-email"
            name="email"
            placeholder="Enter student email"
            required
        >

        <button type="submit">Make Coordinator</button>

    </form>

    <div id="coordinator-message"></div>

</div>
